name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check default features
        run: cargo check --workspace --all-targets --locked

      - name: Check resolver lib-only (no sidecar)
        run: cargo check -p seren-secrets-resolver --no-default-features --locked

      - name: Check sidecar feature
        run: cargo check --workspace --features seren-secrets-resolver/sidecar --locked

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (sidecar feature)
        run: cargo clippy --workspace --all-targets --features seren-secrets-resolver/sidecar --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --features seren-secrets-resolver/sidecar --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Compile on MSRV
        run: cargo check --workspace --features seren-secrets-resolver/sidecar --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --workspace --features seren-secrets-resolver/sidecar --no-deps --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Advisory, ban, and source scan
        run: cargo deny check advisories bans sources
